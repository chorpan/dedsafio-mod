name: build-jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Descomprimir proyecto
        run: unzip -q dedsafio-portales.zip -d proyecto

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
          cache-disabled: true

      - name: Compilar mod
        run: gradle build --no-daemon
        working-directory: proyecto

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: dedsafio-portales-jar
          path: proyecto/build/libs/*.jar
          if-no-files-found: error

