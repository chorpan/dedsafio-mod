name: build-jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el proyecto
        run: unzip -q portales_v02.zip -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Compilar
        run: gradle build
        working-directory: proyecto/totem_berserker_addon
      - uses: actions/upload-artifact@v4
        with:
          name: portalesv2-jar
          path: proyecto/totem_berserker_addon/build/libs/*.jar
