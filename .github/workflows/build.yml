name: build-jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el proyecto
        run: unzip -q "dedsafio_server_pack (1).zip" -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Compilar
        run: gradle build
        working-directory: proyecto/dedsafio_server_pack/mod
      - uses: actions/upload-artifact@v4
        with:
          name: dedsafio_server-jar
          path: proyecto/dedsafio_server_pack/mod/build/libs/*.jar
